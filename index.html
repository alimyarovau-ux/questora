<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Questora</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%238b5cf6'/%3E%3Cpath d='M64 34H42a8 8 0 0 0 0 16h16a8 8 0 0 1 0 16H34' stroke='white' stroke-width='9' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <div id="bg"></div>
    <div id="bgdim"></div>

    <section id="auth" hidden>
        <div class="auth-card">
            <div class="logo">Questora<b></b></div>
            <p class="muted">Nickname va parolni kiriting. Nickname yangi bo'lsa, akkaunt avtomatik yaratiladi.</p>
            <form id="f-login" class="form">
                <input name="nick" placeholder="Nickname" required autocomplete="username">
                <input name="password" type="password" placeholder="Parol" required autocomplete="current-password">
                <button class="btn">Kirish</button>
            </form>
            <p id="auth-msg" class="msg" role="alert"></p>
        </div>
    </section>

    <div id="app" hidden>
        <aside id="side">
            <div class="side-top">
                <div class="logo sm">Questora<b></b></div><button id="collapse" aria-label="Collapse menu"><svg class="i"
                        viewBox="0 0 24 24">
                        <line x1="4" x2="20" y1="12" y2="12" />
                        <line x1="4" x2="20" y1="6" y2="6" />
                        <line x1="4" x2="20" y1="18" y2="18" />
                    </svg></button>
            </div>
            <nav id="nav"></nav>
        </aside>
        <div id="wrap">
            <header id="top">
                <button id="burger" aria-label="Menu"><svg class="i" viewBox="0 0 24 24">
                        <line x1="4" x2="20" y1="12" y2="12" />
                        <line x1="4" x2="20" y1="6" y2="6" />
                        <line x1="4" x2="20" y1="18" y2="18" />
                    </svg></button>
                <input id="gsearch" placeholder="Search games..." aria-label="Search games">
                <span id="badge" class="pill" hidden></span>
                <div class="bellwrap"><button id="bell" aria-label="Notifications"><svg class="i" viewBox="0 0 24 24">
                            <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
                            <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
                        </svg><i id="cnt" hidden>0</i></button>
                    <div id="dd" hidden></div>
                </div>
                <button id="userbtn" class="userbtn"></button>
            </header>
            <main id="main" tabindex="-1"></main>
            <footer class="foot muted small">&copy; Questora</footer>
        </div>
    </div>

    <div id="modal" hidden>
        <div class="box" role="dialog" aria-modal="true"></div>
    </div>
    <div id="toasts" aria-live="polite"></div>
    <div id="boot" class="boot">
        <div class="spin"></div>
    </div>

    <script src="apps.js"></script>
</body>

</html>
